name: Deploy Supabase Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-gateway.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gateway Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            echo "Create at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          REF="${PROJECT_REF:-ilwfzrepvosxpefdomml}"
          npx supabase functions deploy gateway --project-ref "$REF"
